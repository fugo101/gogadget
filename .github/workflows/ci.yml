name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Secrets, format, versions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans the history
      - name: Install gitleaks and clang-format
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          pipx install clang-format==23.1.3
      - name: Secrets (tracked files and history)
        run: |
          tools/check_secrets.sh
          gitleaks git --no-banner --redact .
      - name: Format
        run: make format-check
      - name: LVGL version is the same for firmware and simulator
        run: tools/check_versions.sh

  host:
    name: Host tests and golden screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build
        # No SDL here: the viewer is for local use; the tests are headless.
        run: |
          cmake -S sim -B sim/build -G Ninja -DGG_SIM_VIEWER=OFF
          cmake --build sim/build
      - name: Test
        run: ctest --test-dir sim/build --output-on-failure
      - name: Upload screenshot mismatches
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-mismatches
          path: ui/test/golden/*_err.png
          if-no-files-found: ignore

  firmware:
    name: Firmware build (ESP-IDF v6.1)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v7
      - name: Build
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -C firmware build
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/ota_data_initial.bin
            firmware/build/gogadget.bin
            firmware/build/gogadget.elf
            firmware/build/flasher_args.json
