# Monthly check of the LilyGO repositories Gogadget learns from (policy: docs/upstream.md).
# tools/upstream-watch.sh exits 0 (no drift), 10 (drift) or anything else (error).
# On drift this opens an "Upstream drift YYYY-MM-DD" issue, or comments on the open
# issue labelled upstream-drift instead of opening a duplicate.
name: upstream-watch

on:
  schedule:
    - cron: "23 4 1 * *" # 04:23 UTC on the 1st of each month (off the hour, when runners queue less)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-watch
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pdftotext (poppler-utils)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends poppler-utils

      - name: Run tools/upstream-watch.sh
        id: watch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          bash tools/upstream-watch.sh tools/upstream.lock > report.txt
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          cat report.txt
          # Keep whole lines within 60000 characters: an issue body or comment holds at most
          # 65536. The script prints its summary first, so a cut only loses per-file details.
          awk -v max=60000 '
            { n += length($0) + 1 }
            n <= max { print; next }
            { cut = 1 }
            END { if (cut) print "[truncated: the full report is in the workflow run log]" }
          ' report.txt > report-short.txt
          {
            echo "### upstream-watch: exit $rc"
            echo
            echo '~~~~~~text'
            cat report-short.txt
            echo '~~~~~~'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 10 ]; then
            echo "::error::upstream-watch failed with exit code $rc; see the log above"
            exit 1
          fi

      - name: Open or update the drift issue
        if: steps.watch.outputs.rc == '10'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          today=$(date -u +%F)
          # The report goes inside a ~~~~~~ fence: upstream text then cannot render as
          # Markdown, mention people (@name) or link Gogadget issues (#123).
          {
            echo "tools/upstream-watch.sh found upstream changes in watched LilyGO paths on $today."
            echo
            echo "Triage each change as described in docs/upstream.md (hardware truth; init, backlight, sleep or pin code; toolchain or docs; ignore), update the affected notes, then bump the pin in tools/upstream.lock in the same commit and close this issue."
            echo
            echo "Full report: $RUN_URL"
            echo
            echo '~~~~~~text'
            cat report-short.txt
            echo '~~~~~~'
          } > body.md
          if ! gh api "repos/$GH_REPO/labels/upstream-drift" --silent 2>/dev/null; then
            gh label create upstream-drift --color FBCA04 \
              --description "LilyGO upstream changed in watched paths (tools/upstream-watch.sh)"
          fi
          issue=$(gh issue list --label upstream-drift --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file body.md
          else
            gh issue create --title "Upstream drift $today" --label upstream-drift --body-file body.md
          fi
